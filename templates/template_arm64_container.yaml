AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lemma Lambda Function (container image, big-tools)

Globals:
  Function:
    Timeout: %TIMEOUT%

Resources:
  LemmaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: %MEMORY%
      Architectures:
        - arm64
      EphemeralStorage:
        Size: %EPHEMERAL%
      Environment:
        Variables:
          AWS_LWA_INVOKE_MODE: response_stream
          LEMMA_API_KEY: %API_KEY%
          LEMMA_TIMEOUT: %TIMEOUT%
          HOME: /tmp
          PORT: 8000
          # API-key sources for better recon coverage (see API-KEYS.md).
          # Set to e.g. ssm:/lemma/subfinder, secret:lemma/amass, s3://bucket/key,
          # or env:VARNAME. Leave blank to run without keys.
          LEMMA_SUBFINDER_CONFIG: ""
          LEMMA_AMASS_CONFIG: ""
          # github-subdomains token: literal in GITHUB_TOKEN, or a
          # ssm:/secret:/s3:// source in LEMMA_GITHUB_TOKEN (resolved at runtime).
          GITHUB_TOKEN: ""
          LEMMA_GITHUB_TOKEN: ""
      # Allow reading API-key configs from SSM / Secrets Manager (scoped to a
      # /lemma/ naming convention). Uncomment S3ReadPolicy and set your bucket if
      # you store configs in S3 instead.
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: lemma/*
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lemma/*"
        # - S3ReadPolicy:
        #     BucketName: my-lemma-secrets-bucket
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
    Metadata:
      DockerTag: lemma-arm64
      DockerContext: .
      Dockerfile: Dockerfile.lambda
      DockerBuildArgs:
        TOOL_ARCH: arm64
      # NOTE: building an arm64 image on an x86 host requires buildx + qemu
      # (binfmt). build.sh sets DOCKER_DEFAULT_PLATFORM=linux/arm64 for you;
      # ensure `docker run --privileged --rm tonistiigi/binfmt --install arm64`
      # has been run once on the host if you are cross-building.

Outputs:
  LemmaFunctionUrl:
    Description: "Lemma Lambda Function URL"
    Value: !Sub "LEMMA_URL:${LemmaFunctionUrl.FunctionUrl}"
  LemmaFunction:
    Description: "Lemma Lambda Function ARN"
    Value: !GetAtt LemmaFunction.Arn
